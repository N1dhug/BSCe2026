name: BM regression and notes
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'root/**'
      - 'AGENTS.md'
      - '.github/workflows/bm-review.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'root/**'
      - 'AGENTS.md'
      - '.github/workflows/bm-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bm-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check night launcher on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/check_g2b_night_launcher.ps1
      - name: Check actual Windows file-sharing locks
        shell: powershell
        run: python -B -m unittest tests.test_checkpoint_io -v
      - name: Install distributed runner test dependencies
        run: python -m pip install numpy scipy matplotlib pandas openpyxl
      - name: Check hourly characteristic and positive CN controls on Windows
        shell: powershell
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -B -m unittest tests.test_bm1_interval_characteristic -v
      - name: Check G4 response/archive controls on Windows
        shell: powershell
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -B -m unittest tests.test_bm1_deterministic_response -v
      - name: Check portable split bundles on Windows
        shell: powershell
        run: python -B -m unittest tests.test_run_bundle -v
      - name: Check distributed resume and real spawned workers on Windows
        shell: powershell
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -B -m unittest tests.test_bm1_distributed -v
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib pandas openpyxl
      - name: Record reviewed source and environment
        run: |
          mkdir -p review-results
          git rev-parse HEAD > review-results/commit.txt
          git archive HEAD src tests root > review-results/source.tar
          python -m pip freeze > review-results/environment.txt
      - name: Run complete regression suite
        run: python -B -m unittest discover -s tests -v 2>&1 | tee review-results/tests.txt
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-review-${{ github.sha }}
          path: review-results/
          retention-days: 7
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LaTeX for the runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-lang-european lmodern
      - name: Build notes to stable references
        run: python -B root/f4/build.py
      - name: Save verified PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f4-notes-${{ github.sha }}
          path: root/f4/build/main.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Save LaTeX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-note-logs-${{ github.sha }}
          path: root/f4/build/*.log
          if-no-files-found: ignore
          retention-days: 7

name: BM focused checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'root/**'
      - 'AGENTS.md'
      - '.github/workflows/bm-review.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Build F4 PDF only when needed'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bm-review-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse changed Python files without imports or numerical runs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PYTHON'
          import ast
          import os
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=ACMR', '-z',
              os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA'],
          ]).decode().split('\0')
          checked = 0
          for name in paths:
              path = Path(name)
              if path.suffix == '.py' and path.is_file():
                  ast.parse(path.read_bytes(), filename=name)
                  checked += 1
          print(f'Syntax checked: {checked} changed Python files. No numerical tests requested.')
          PYTHON
  notes:
    if: github.event_name == 'workflow_dispatch' && inputs.notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LaTeX for the runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-lang-european lmodern
      - name: Build notes to stable references
        run: python -B root/f4/build.py
      - name: Save verified PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f4-notes-${{ github.sha }}
          path: root/f4/build/main.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Save LaTeX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-note-logs-${{ github.sha }}
          path: root/f4/build/*.log
          if-no-files-found: ignore
          retention-days: 7

  report_regression:
    name: Chapters 3–5 regression tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test requirements
        run: python -m pip install numpy scipy pandas matplotlib openpyxl pytest
      - name: Run retained report tests (synthetic inputs)
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests/test_report_imports.py tests/test_moving_horizon_method.py tests/test_baseline_diagnostics.py tests/test_bm_1_fixed_beta.py tests/test_bm_1_fixed_beta_samples.py tests/test_joint_drift_qp.py tests/test_simple_baselines.py tests/test_wm4_baseline_moving_horizon_quality.py tests/test_wm4_corresponding_interval_fit.py tests/test_wm4_methodology_uncertainty.py tests/test_wm4_moving_horizon_diffusion.py tests/test_wm4_moving_horizon_plot.py tests/test_wm4_plot_diffusion_demand_std.py tests/test_wm4_plot_moving_horizon_quality.py tests/test_wm4_selected_sample_nll.py tests/test_wm4_weekday_horizon_sweep.py

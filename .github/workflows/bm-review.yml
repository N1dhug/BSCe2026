name: BM F1 F3 regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'root/F1.md'
      - 'root/F2*.md'
      - 'root/F3.md'
      - 'root/BM_GUIDE.md'
      - 'root/BM_PERFORMANCE.md'
      - '.github/workflows/bm-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bm-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib pandas openpyxl
      - name: Record reviewed source and environment
        run: |
          mkdir -p review-results
          git rev-parse HEAD > review-results/commit.txt
          git archive HEAD src tests root > review-results/source.tar
          python -m pip freeze > review-results/environment.txt
      - name: Run complete regression suite
        run: python -B -m unittest discover -s tests -v 2>&1 | tee review-results/tests.txt
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-review-${{ github.sha }}
          path: review-results/
          retention-days: 7

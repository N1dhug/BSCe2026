name: BM focused checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'root/**'
      - 'AGENTS.md'
      - '.github/workflows/bm-review.yml'
  workflow_dispatch:
    inputs:
      tests:
        description: 'Space-separated unittest methods/classes/modules; choose only affected G or F checks'
        type: string
        default: ''
      runner:
        description: 'Windows only for platform-specific changes'
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest
      full_suite:
        description: 'Explicit exceptional full regression (G and F); not a routine gate'
        type: boolean
        default: false
      notes:
        description: 'Build F4 PDF only when needed'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bm-review-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse changed Python files without imports or numerical runs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PYTHON'
          import ast
          import os
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=ACMR', '-z',
              os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA'],
          ]).decode().split('\0')
          checked = 0
          for name in paths:
              path = Path(name)
              if path.suffix == '.py' and path.is_file():
                  ast.parse(path.read_bytes(), filename=name)
                  checked += 1
          print(f'Syntax checked: {checked} changed Python files. No numerical tests requested.')
          PYTHON
  selected-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.tests != '' || inputs.full_suite)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SELECTED_TESTS: ${{ inputs.tests }}
      FULL_SUITE: ${{ inputs.full_suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib pandas openpyxl
      - name: Run only explicitly selected checks
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys
          selected = os.environ['SELECTED_TESTS'].split()
          full = os.environ['FULL_SUITE'] == 'true'
          if full and selected:
              sys.exit('Choose targeted checks OR full_suite, not both.')
          if any(not re.fullmatch(r'tests\.[A-Za-z_][A-Za-z0-9_.]*', name) for name in selected):
              sys.exit('Use dotted unittest names starting with tests.; no shell arguments.')
          args = ['discover', '-s', 'tests', '-v'] if full else [*selected, '-v']
          sys.exit(subprocess.call([sys.executable, '-B', '-m', 'unittest', *args]))
  notes:
    if: github.event_name == 'workflow_dispatch' && inputs.notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LaTeX for the runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-lang-european lmodern
      - name: Build notes to stable references
        run: python -B root/f4/build.py
      - name: Save verified PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f4-notes-${{ github.sha }}
          path: root/f4/build/main.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Save LaTeX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-note-logs-${{ github.sha }}
          path: root/f4/build/*.log
          if-no-files-found: ignore
          retention-days: 7

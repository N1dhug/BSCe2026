name: BM Thomas transfer checks
on:
  pull_request:
    branches: [main]
jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pandas matplotlib openpyxl
      - name: Synthetic integration and BM regression checks
        run: python -B -m unittest tests.test_bm1_thomas_pipeline tests.test_mpc_checkpoint_windows tests.test_bm1_known_input_fit tests.test_bm1_deterministic_response tests.test_bm1_g_basic tests.test_bm1_piecewise_response -v
      - name: Entrypoint import checks
        run: |
          python -B -m src.exe.run_model.bm_1.predict_daily --help
          python -B -m src.exe.run_model.bm_1.predict_mpc --help
          python -B -m src.exe.run_model.bm_1.plot_prediction --help
          python -B -m src.exe.run_model.compare_model_predictions --help
          python -B -m src.exe.run_model.compare_all_model_predictions --help
          python -B -m src.exe.run_model.compare_mpc_predictions --help

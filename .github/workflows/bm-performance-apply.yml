name: Apply tested BM performance CLI
on:
  push:
    branches: ['performance/bm-fv-evaluation']
    paths: ['.github/workflows/bm-performance-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/performance/bm-fv-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only hash-verified source transformations
        run: python root/_apply_bm_fast_cli.py
      - name: Install test dependencies
        run: python -m pip install numpy scipy matplotlib pandas openpyxl
      - name: Verify complete regression suite before committing
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee performance-tests.txt
      - name: Commit only the reviewed experiment interfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/exe/run_model/bm_1/multi_price_optimization_experiment.py src/exe/run_model/bm_1/complex_target_multi_price_experiment.py tests/test_bm_1_complex_target_multi_price_experiment.py
          git commit -m 'Expose opt-in fast FV in BM experiments after regression verification'
          git push origin HEAD:performance/bm-fv-evaluation
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-performance-application
          path: performance-tests.txt
          retention-days: 7

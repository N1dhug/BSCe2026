name: One-time BM1 consolidation
on:
  push:
    branches: ['refactor/bm-f1-f3-cleanup']
    paths: ['.bm_cleanup_bundle.b64']
permissions:
  contents: write
jobs:
  consolidate:
    if: startsWith(github.event.head_commit.message, 'Run verified BM1 consolidation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy matplotlib pandas openpyxl
      - name: Unpack verified refactor tools
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'refactor/bm-f1-f3-cleanup'
          git merge-base --is-ancestor 8f322a87b9d77e416501dafdc436cbfe85e51024 HEAD
          mkdir -p "$RUNNER_TEMP/bm-cleanup" "$RUNNER_TEMP/cleanup-evidence"
          python - <<'PY'
          import base64, hashlib, io, os, zipfile
          from pathlib import Path
          encoded = ''.join(Path(f'.bm_cleanup/part{i}.b64').read_text().strip() for i in range(6))
          assert len(encoded) == 18576
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'c55604e6319a61e98e2e2f726afe028d6325bc48a88efe4482f15388b894ce71'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert set(z.namelist()) == {'refactor.py', 'snapshot.py'}
              z.extractall(Path(os.environ['RUNNER_TEMP']) / 'bm-cleanup')
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/cleanup-evidence/input_commit.txt"
          python -m pip freeze > "$RUNNER_TEMP/cleanup-evidence/environment.txt"
      - name: Baseline tests and numerical snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/cleanup-evidence/before_tests.txt"
          python -B "$RUNNER_TEMP/bm-cleanup/snapshot.py" "$GITHUB_WORKSPACE" before "$RUNNER_TEMP/cleanup-evidence" 2>&1 | tee "$RUNNER_TEMP/cleanup-evidence/before_snapshot.txt"
      - name: Consolidate and verify
        shell: bash
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/bm-cleanup/refactor.py" "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/cleanup-evidence/refactor.txt"
          python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/cleanup-evidence/after_tests.txt"
          python -B "$RUNNER_TEMP/bm-cleanup/snapshot.py" "$GITHUB_WORKSPACE" after "$RUNNER_TEMP/cleanup-evidence" 2>&1 | tee "$RUNNER_TEMP/cleanup-evidence/after_snapshot.txt"
          python -B -m src.exe.run_model.bm_1.optimize contract --optimize 2>&1 | tee "$RUNNER_TEMP/cleanup-evidence/contract.txt"
          python -B -m src.exe.run_model.bm_1.refine 2>&1 | tee "$RUNNER_TEMP/cleanup-evidence/refinement.txt"
      - name: Check scope and commit only to cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'refactor/bm-f1-f3-cleanup'
          git restore -- .github/workflows/bm-review.yml
          python - <<'PY'
          import subprocess
          allowed = ('src/exe/run_model/bm_1/', 'src/method/bm_1_', 'src/validation/bm_1/', 'tests/', 'root/')
          exact = {'.gitignore', 'src/validation/method/bm_1.py', 'src/tools/bm_1_data.py', 'src/model/bm_1.py', 'src/diagnostics/bm_1.py', 'src/diagnostics/stochastic.py', 'src/validation/model/bm_1.py', 'src/validation/diagnostics/bm_1.py', 'src/validation/exe/__init__.py', 'files/output/bm_1_fast_fv_benchmark.json', 'files/output/graphs/bm_1/bm_1_em_price_step.png', 'files/output/graphs/bm_1/bm_1_fp_price_step.png'}
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          bad = [p for p in changed if p not in exact and not p.startswith(allowed) and not ('__pycache__/' in p and p.endswith('.pyc'))]
          assert not bad, f'Unexpected shared/evidence changes: {bad}'
          PY
          git add -A -- src tests root .gitignore files/output/bm_1_fast_fv_benchmark.json files/output/graphs/bm_1/bm_1_em_price_step.png files/output/graphs/bm_1/bm_1_fp_price_step.png
          git diff --cached --stat > "$RUNNER_TEMP/cleanup-evidence/diff_stat.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate BM1 F1-F3 modules and remove obsolete files'
          git push origin HEAD:refs/heads/refactor/bm-f1-f3-cleanup
          git rev-parse HEAD > "$RUNNER_TEMP/cleanup-evidence/output_commit.txt"
      - name: Save before and after verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bm-cleanup-verification
          path: ${{ runner.temp }}/cleanup-evidence/
          retention-days: 14
